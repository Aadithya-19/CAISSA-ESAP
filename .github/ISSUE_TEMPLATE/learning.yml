name: Learning task (80-20)
description: Cross-track work for the 20% outside your lane
title: "[learning][track] topic"
labels: ["type:learning", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for the 20% outside your track. Written by whoever owns the
        destination track, picked up by anyone. Your 80% comes first.
  - type: dropdown
    id: track
    attributes:
      label: Track you want to learn
      options: [ml, rtl, embedded, mech]
    validations:
      required: true
  - type: input
    id: mentor
    attributes:
      label: Who owns this area
      placeholder: "@handle, ping them when stuck"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: The task
      description: Small and real. Something the project actually needs, not a tutorial.
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: Start here
      description: One or two links or file paths. Not a syllabus.
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] 
        - [ ] 
