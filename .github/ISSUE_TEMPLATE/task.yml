name: Task
description: A unit of work someone can pick up and finish
title: "[track] short imperative title"
labels: ["type:task", "status:ready"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      options: [ml, rtl, embedded, mech, docs, tooling]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What exists when this is done that does not exist now.
      placeholder: A cocotb testbench that loads golden vectors and asserts bit-exact match.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checklist a reviewer can verify without asking you.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (under 2 hours)", "M (a week of evenings)", "L (split this)"]
    validations:
      required: true
  - type: input
    id: blocks
    attributes:
      label: Blocks or depends on
      placeholder: "Blocked by #14"
  - type: checkboxes
    id: newcomer
    attributes:
      label: Suitability
      options:
        - label: Good first issue for someone new to this track
