name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: rtl

      - name: lint
        run: pixi run lint-solution

      # stp_sr.sv is the unfilled exercise and is meant to fail, so CI runs
      # the reference instead. what's being checked is the testbench and the
      # toolchain, not a member's homework.
      - name: lesson 02
        run: pixi run check

      - name: lesson 02 at width 12
        run: pixi run check-width
