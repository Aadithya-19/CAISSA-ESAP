[workspace]
name = "caissa"
version = "0.1.0"
description = "NNUE chess evaluation in FPGA fabric"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"

[feature.ml.dependencies]
numpy = ">=2.0,<3"
chess = ">=1.11"
pytest = ">=8.0"

[feature.ml.tasks]
ml-test = { cmd = "pytest -q", cwd = "onload/ml" }

# cocotb only ships linux-64 and osx-64 on conda-forge. no windows, no apple
# silicon - both of those do RTL work in WSL2 or on ThinLinc.
[feature.rtl]
platforms = ["linux-64", "osx-64"]

[feature.rtl.dependencies]
cocotb = ">=1.9,<2"        # 2.x renames units= and drops the makefile flow
pytest = ">=8.0"
pytest-xdist = ">=3.0"     # pytest -n auto
make = "*"
verilator = ">=5.020,<6"   # thinlinc has 5.026, pin to match once checked
yosys = ">=0.40"

[feature.rtl.target.linux-64.dependencies]
gtkwave = "*"              # linux only on conda-forge

[feature.rtl.tasks]
test = "make test"
lint = "make lint"
waves = "make waves"
lesson = "make lesson"
estimate = "yosys -p 'read_verilog -sv rtl/*/*.sv; synth_xilinx -family xc7; stat'"

[environments]
default = ["ml"]
rtl = ["rtl"]
